[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linecontrol"
version = "1.0.0"
description = "Deterministic sequencing, interlock and record-store service"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["linecontrol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
